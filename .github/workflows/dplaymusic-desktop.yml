name: DplayMusic Desktop (Windows, macOS, Linux)

# Builds the DplayMusic desktop installers with Conveyor (cross-builds from Linux):
#   - Linux:   DplayMusic-x86_64.AppImage
#   - Windows: DplayMusic-Windows-installer.zip (install.bat + certificate + .msix)
#   - macOS:   DplayMusic-<version>-mac-aarch64.dmg / -mac-amd64.dmg (wrapped on a Mac runner)
#
# Run it from Actions → "Run workflow", or push a tag like v2.3.0 to also publish
# a GitHub Release (the app's update check reads releases/latest of this repo).
#
# Required secret: CONVEYOR_SIGNING_KEY (Conveyor root key, "<24 words>/<timestamp>").

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop-packages:
    name: Build packages (AppImage + Mac zip + Windows msix)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Install libfuse2
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: FOSS build flavor (no Sentry / Last.fm / Cast secrets needed)
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties
          touch ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Cache mpv-natives
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-${{ hashFiles('composeApp/build.gradle.kts') }}

      - name: Populate mpv-natives for all OSes
        run: ./gradlew :composeApp:mpvSetupAll --no-configuration-cache

      - name: Generate Conveyor config
        run: ./gradlew :desktopApp:writeConveyorConfig --no-configuration-cache

      - name: Run Conveyor (linux-app)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: -Kapp.machines=linux.amd64.glibc make linux-app
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      - name: Wrap Linux app tree → AppImage
        run: ./gradlew :desktopApp:packageConveyorAppImage --no-configuration-cache

      - name: Run Conveyor (make site, Mac + Windows only)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: '-Kapp.machines=[mac.amd64,mac.aarch64,windows.amd64] make site'
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      - name: Stage AppImage into output/
        run: cp desktopApp/build/appimage/conveyor/DplayMusic-*.AppImage output/

      - name: Show built artifacts
        run: ls -lh output/

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: desktop-appimage
          path: output/DplayMusic-*.AppImage
          if-no-files-found: error

      - name: Upload macOS zips
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-zips
          path: output/*-mac-*.zip
          if-no-files-found: error

      - name: Bundle Windows offline installer
        run: |
          set -euo pipefail
          crt=$(ls output/*.crt 2>/dev/null | head -1)
          msix=$(ls output/*.x64.msix 2>/dev/null | head -1)
          if [ -z "$crt" ] || [ -z "$msix" ]; then
            echo "::error::Conveyor did not produce the Windows certificate/msix"
            ls -la output/
            exit 1
          fi
          mkdir -p installers/
          stage="$(mktemp -d)"
          cp scripts/windows/install.bat "$stage/"
          cp "$crt"  "$stage/dplaymusic.crt"
          cp "$msix" "$stage/dplaymusic-$(basename "$msix" | sed -E 's/^[^-]+-//')"
          ( cd "$stage" && zip -q -j "${GITHUB_WORKSPACE}/installers/DplayMusic-Windows-installer.zip" ./* )
          rm -rf "$stage"
          unzip -l installers/DplayMusic-Windows-installer.zip

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: installers/DplayMusic-Windows-installer.zip

  wrap-mac-dmg:
    name: Wrap macOS .zip → .dmg
    runs-on: macos-14
    needs: build-desktop-packages
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install create-dmg + ImageMagick
        run: brew install create-dmg imagemagick

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Mac .zip artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac-zips
          path: mac-zips

      - name: Prepare background
        run: |
          mkdir -p build/dmg
          magick composeApp/icon/dmg-background.png -filter Lanczos -resize 1400x800 build/dmg/dmg-bg-1400x800.png

      - name: Wrap each Mac .zip into a .dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for zip in mac-zips/*-mac-*.zip; do
            arch="$(basename "$zip" | sed -nE 's/.*-mac-([a-z0-9]+)\.zip/\1/p')"
            [[ -z "$arch" ]] && { echo "Cannot infer arch from $zip" >&2; exit 1; }
            workdir="$(mktemp -d)"
            unzip -q "$zip" -d "$workdir"
            app="$(find "$workdir" -maxdepth 2 -type d -name '*.app' | head -1)"
            [[ -d "$app" ]] || { echo "No .app inside $zip" >&2; exit 1; }
            scripts/wrap-mac-dmg.sh "$app" build/dmg/dmg-bg-1400x800.png composeApp/icon/circle_app_icon.icns "dist/DplayMusic-${VERSION}-mac-${arch}.dmg"
            rm -rf "$workdir"
          done
          ls -lh dist/

      - name: Upload Mac .dmg
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-desktop-packages, wrap-mac-dmg]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: DplayMusic ${{ github.ref_name }}
          body: |
            ### DplayMusic Desktop ${{ github.ref_name }}
            - **Windows:** descarga `DplayMusic-Windows-installer.zip`, descomprime y ejecuta `install.bat`.
            - **macOS (Apple Silicon M1–M4):** `DplayMusic-*-mac-aarch64.dmg` · **macOS Intel:** `DplayMusic-*-mac-amd64.dmg` (requiere macOS 15+).
            - **Linux:** `DplayMusic-x86_64.AppImage` (dale permiso de ejecución).

            By NiuCode · Basado en SimpMusic (GPL-3.0). Packaged with [Conveyor](https://hydraulic.dev).
          files: |
            artifacts/desktop-appimage/*
            artifacts/desktop-windows/*
            artifacts/desktop-mac-dmg/*
